<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Survey 1</title>
    <link rel='stylesheet' href='/css/style.css'>
    <script src="/js/path.js" defer></script>
    <script src="/js/state.js" defer></script>
    <script src="/js/Popup.js" defer></script>
    <script src="/js/main.js" defer></script>
    

</head>

<body>

    <form id="surveyForm">

        <div class="question">
            <p>What is your name?</p>
            <input type="text" id="username" name="username" required question-answer>
        </div>

        <div class="question">
            <p>What is your favorite color</p>
            <input type="color" id="color" name="color" question-answer>
        </div>

        <div class="question">
            <p>How old are you?</p>
            <input type="text" id="age" name="age" question-answer>
        </div>

        <button id="submitBtn">Next</button>

    </form>



</body>

<script>
    //submit button, checks of all fields are filled
    document.getElementById("submitBtn").addEventListener("click", e => {
        const form = document.getElementById("surveyForm");
        if (!form.reportValidity()) {
            alert("POPUP PLACEHOLDER: not finished"); //TODON MAKE POPUP THING
            return;
        }
        e.preventDefault(); //otherwise form thinks its a submit button, which reloads th epage
        saveAnswersToSession();
        location.href = PATH.survey[2];
    });
</script>

</html>
