<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <link rel='stylesheet' href='../../css/style.css'>

</head>

<body>
    <div class="nav-bar">

    </div>


    <div class="main-container">
        <div class="left-panel">
            <div class="watcher-container">
                <img src="../../images/yeah.gif" alt="advert">
            </div>
        </div>

        <div class="main-content">
            <form id="surveyForm">
        
                <div class="question">
                    <p>What is your name?</p>
                    <input type="text" id="username" name="username" required question-answer>
                </div>
        
                <div class="question">
                    <p>What is your favorite color</p>
                    <input type="color" id="color" name="color" question-answer>
                </div>
        
                <div class="question">
                    <p>How old are you?</p>
                    <input type="text" id="age" name="age" question-answer>
                </div>
        
                <button id="submitBtn">Next</button>
        
            </form>
        </div>


        <div class="right-panel">
            <img src="../../images/xpmagazine.gif" alt="advert">
            <img src="../../images/windowsxp.gif" alt="advert">
            <img src="../../images/powerbook.gif" alt="advert">
            <img src="../../images/petquarters.gif" alt="advert">
            <img src="../../images/lcd.gif" alt="advert">
            <img src="../../images/glitterchu.gif" alt="advert">
            <img src="../../images/furby.jpg" alt="advert">
            <img src="../../images/emails.gif" alt="advert">
            <img src="../../images/ebay.gif" alt="advert">
            <img src="../../images/casino.gif" alt="advert">
            <img src="../../images/carbonate.gif" alt="advert">
            <img src="../../images/britney.gif" alt="advert">
            <img src="../../images/anniversary.gif" alt="advert">
            <img src="../../images/anime3.gif" alt="advert">
            <img src="../../images/anime2.gif" alt="advert">


        </div>

    </div>

    



</body>

<script>
    //submit button, checks of all fields are filled
    document.getElementById("submitBtn").addEventListener("click", e => {
        const form = document.getElementById("surveyForm");
        if (!form.reportValidity()) {
            alert("POPUP PLACEHOLDER: not finished"); //TODON MAKE POPUP THING
            return;
        }
        e.preventDefault(); //otherwise form thinks its a submit button, which reloads th epage
        saveAnswersToSession();
        location.href = PATH.survey[2];
    });
</script>

</html>
